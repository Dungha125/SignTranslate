# Infra cho SignTranslate: Redis (cache + metadata) và MinIO (object store video).
# Chạy:  docker compose -f sign_translate/docker-compose.yml up -d
name: signtranslate

services:
  redis:
    image: redis:7.4-alpine
    container_name: signtranslate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: signtranslate-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-signtranslate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-signtranslate123}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo sẵn bucket + policy đọc công khai cho thumbnail.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: signtranslate-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-signtranslate} $${MINIO_ROOT_PASSWORD:-signtranslate123} &&
      mc mb --ignore-existing local/vsl-videos &&
      mc mb --ignore-existing local/vsl-dataset &&
      mc mb --ignore-existing local/vsl-thumbs &&
      mc anonymous set download local/vsl-thumbs &&
      echo 'buckets ready'
      "

volumes:
  redis-data:
  minio-data:
